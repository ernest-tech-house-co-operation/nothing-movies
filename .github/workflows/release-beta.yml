name: Release (Beta)

on:
  push:
    branches: [ beta ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build \
            qt6-base-dev qt6-declarative-dev qml6-module-qtquick-controls \
            qml6-module-qtquick-templates qml6-module-qtqml-workerscript \
            qml6-module-qtquick-layouts \
            libcurl4-openssl-dev \
            nlohmann-json3-dev \
            libzip-dev zipcmp zipmerge ziptool \
            libtorrent-rasterbar-dev \
            libmpv-dev \
            libssl-dev \
            libboost-all-dev

      - name: Configure
        run: >
          cmake -B build -GNinja
          -DTMDB_API_KEY=${{ secrets.TMDB_API_KEY }}

      - name: Build
        run: cmake --build build

      - name: Package
        run: |
          mkdir -p dist
          cp build/app/nothingmovies dist/nothingmovies-v0.0.1-beta-linux

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.0.1-beta-${{ github.sha }}
          name: v0.0.1-beta
          prerelease: true
          files: dist/*

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-declarative
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-qt6-webengine
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-libtorrent-rasterbar
            mingw-w64-x86_64-libmpv
            mingw-w64-x86_64-nlohmann-json
            zip

      - name: Configure
        run: >
          cmake -B build -GNinja
          -DCMAKE_BUILD_TYPE=Release
          -DTMDB_API_KEY=${{ secrets.TMDB_API_KEY }}

      - name: Build
        run: cmake --build build

      - name: Package
        run: |
          mkdir -p dist/nothingmovies-v0.0.1-beta-windows
          cp build/app/nothingmovies.exe dist/nothingmovies-v0.0.1-beta-windows/
          windeployqt --release --no-translations \
            dist/nothingmovies-v0.0.1-beta-windows/nothingmovies.exe
          cd dist
          zip -r nothingmovies-v0.0.1-beta-windows.zip nothingmovies-v0.0.1-beta-windows

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: nothingmovies-windows-beta
          path: dist/nothingmovies-v0.0.1-beta-windows.zip